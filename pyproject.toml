[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["ingestion", "search", "agents", "api"]
omit = ["tests/*", "ui/*", "eval/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
